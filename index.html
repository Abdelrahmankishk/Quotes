<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,600&family=Libre+Baskerville:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Quotes App</title>
  </head>
  <body>
    <div class="aurora" aria-hidden="true">
      <span class="orb orb-gold"></span>
      <span class="orb orb-violet"></span>
      <span class="orb orb-rose"></span>
    </div>

    <main
      class="container min-vh-100 d-flex align-items-center justify-content-center py-5"
    >
      <div class="content text-center">
        <h1 class="title">Quote of the Day</h1>
        <p class="lead-text">
          Press the button below to receive a random quote!
        </p>

        <figure class="quote-card" aria-live="polite" aria-atomic="true">
          <p id="quote"></p>
          <p id="author"></p>
        </figure>

        <button type="button" class="btn btn-quote" onclick="newQuote()">
          <svg
            class="btn-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </svg>
          <span>New Quote</span>
        </button>
      </div>
    </main>

    <script src="js/main.js"></script>
  </body>
</html>
